name: servicios
description: "iNeed Flutter - migracion de Android nativo a Flutter usando Firebase Realtime Database."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase / FlutterFire
  firebase_core: ^4.11.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.4.1

  # Estado y arquitectura
  flutter_riverpod: ^3.0.0

  # Login social
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.2

  # Mapas, ubicacion y permisos
  google_maps_flutter: ^2.15.0
  geolocator: ^14.0.0
  permission_handler: ^12.0.3
  pointer_interceptor: ^0.10.1+2

  # Utilitarios
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/markers/
    - assets/logos/

  fonts:
    - family: Fq
      fonts:
        - asset: assets/fonts/fq_regular.ttf
          weight: 400
        - asset: assets/fonts/fq_light.ttf
          weight: 300
        - asset: assets/fonts/fq_medium.ttf
          weight: 500
        - asset: assets/fonts/fq_bold.ttf
          weight: 700
